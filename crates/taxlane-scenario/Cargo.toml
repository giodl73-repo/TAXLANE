[package]
name = "taxlane-scenario"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Portable hypothetical budget scenarios for TAXLANE"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
wasm = ["dep:wasm-bindgen"]

[dependencies]
taxlane-core = { path = "../taxlane-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = { version = "=0.2.127", optional = true }
