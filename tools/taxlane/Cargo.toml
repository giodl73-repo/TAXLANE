[package]
name = "taxlane-tools"
version = "0.1.0"
edition = "2024"

[dependencies]
csv = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
roxmltree = "0.20"
taxlane-core = { path = "../../crates/taxlane-core" }
taxlane-net-interest = { path = "../../crates/taxlane-net-interest" }
taxlane-agr-insurance = { path = "../../crates/taxlane-agr-insurance" }
taxlane-edu-pell = { path = "../../crates/taxlane-edu-pell" }
taxlane-dis-flood = { path = "../../crates/taxlane-dis-flood" }
taxlane-jus-capacity = { path = "../../crates/taxlane-jus-capacity" }
zip = { version = "2", default-features = false, features = ["deflate"] }
